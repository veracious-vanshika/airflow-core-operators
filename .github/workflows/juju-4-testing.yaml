name: juju-4-testing

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      fake-error:
        description: Fake pytest failure line to report. Leave empty to run the real integration tests.
        default: "FAILED tests/integration/test_charms.py::test_deploy - TimeoutError: wait timed out after 600s"
        type: string

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  tests:
    uses: veracious-vanshika/workflows-team/.github/workflows/juju-testing.yaml@main
    secrets:
      ISSUE_LOOKUP_TOKEN: ${{ secrets.ISSUE_LOOKUP_TOKEN }}
    with:
      juju-channel: "4.1/edge"
      runner: ubuntu-latest
      test-commands: >-
        ${{ inputs.fake-error != '' && '["echo \"$FAKE_ERROR\"; exit 1"]' || '[
          "just integration tests/integration/test_charms.py",
          "just integration tests/integration/test_dag_execution.py",
          "just integration tests/integration/test_functional.py",
          "just integration tests/integration/test_ingress.py"]' }}
      setup-command: uv tool install tox
      extra-env: >-
        ${{ format('{{"FAKE_ERROR":{0},"POSTGRES_CHANNEL":"14/stable","POSTGRES_FORCE_DEPLOY":"1"}}', toJSON(inputs.fake-error || '')) }}
      purge-docker: true
      free-disk-space: true
      issue-labels: juju-4,bug
      report-manual-runs: true
